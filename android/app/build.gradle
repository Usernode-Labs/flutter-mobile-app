plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Firebase identity is provisioned by the build environment. Keep local
// checkouts without a client file buildable; Dart then exposes push as
// unavailable instead of silently targeting an unintended project.
def googleServicesJsonCandidates = [
    file('google-services.json'),
    file('src/debug/google-services.json'),
    file('src/profile/google-services.json'),
    file('src/release/google-services.json'),
]
if (googleServicesJsonCandidates.any { candidate -> candidate.exists() }) {
    apply plugin: 'com.google.gms.google-services'
    googleServices {
        missingGoogleServicesStrategy =
            com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
    }
} else {
    logger.lifecycle('Firebase Android configuration is absent; Social push is unavailable.')
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ADD THIS SECTION - Load keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

    android {
        namespace "com.usernode_labs.usernode"
        compileSdk flutter.compileSdkVersion
        def ndkVersionOverride =
                System.getenv("NDK_VERSION") ?: System.getenv("ANDROID_NDK_VERSION")
        ndkVersion ndkVersionOverride ?: flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            jniLibs.srcDirs = ['src/jniLibs']
        }
    }

    defaultConfig {
        applicationId "com.usernode_labs.usernode"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Add this to exclude i686-linux-android (x86 32-bit)
        ndk {
            abiFilters 'arm64-v8a'
        }

        // Environment-based configuration using dart-define variables
        // App name will be controlled via environment variables
        resValue "string", "app_name", "Usernode"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            } else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                // Generate and package native debug symbols (separate from the AAB),
                // so Play Console can symbolicate native crash backtraces.
                debugSymbolLevel 'FULL'
            }
        }
    }


}

flutter {
    source '../..'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-options'
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // ShortcutManagerCompat / IconCompat for homescreen pinned shortcuts.
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
