allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

// Force all subprojects to use Kotlin language version 1.8
// This keeps builds compatible with the current Kotlin toolchain
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.jetbrains.kotlin") {
                details.useVersion "2.1.0"
                details.because("Align Kotlin dependencies with the 2.1.0 toolchain")
            }
        }
    }

    // Configure Kotlin language version for all Kotlin Android projects
    pluginManager.withPlugin("org.jetbrains.kotlin.android") {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                languageVersion = '1.8'
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
