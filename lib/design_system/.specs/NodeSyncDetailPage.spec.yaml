meta:
  name: NodeSyncDetailPage
  input_type: figma
  reference: https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=3964-6219&t=67rRAmjQSNltQwv2-4
  text_only_override: false
intent:
  summary: >
    Explore the upcoming node sync/status experience as a pushed detail page
    with plain white top-surface background, no parallax header, and no card
    containers around the primary content.
  scope: screen
  target: new
pattern_decision:
  operating_mode: diagnostics
  session_shape: glanceable and interruptible
  trust_level: normal
  device_context: one-handed mobile first, small-screen safe
  screen_type: pushed detail
  navigation_model: launched from the Node root later; Widgetbook-only for now
  sheet_vs_dialog_vs_page: >
    Pushed detail page, because sync state combines status, progress, and
    navigable diagnostics that should remain scrollable and shareable.
  cta_placement: >
    No primary CTA. Escape lives in the top app bar back affordance; settings
    remains a top-right utility action. Row-level actions use visible chevrons
    or status trailing text.
  chosen_pattern: >
    M3 small SliverAppBar over surfaceContainerLowest with CustomScrollView,
    implicit section spacing, ListTile rows, IconBadge leading slots, and
    StatusTextTrailing/TextChevronTrailing for trailing state.
  rejected_alternatives:
    - pattern: ParallaxSurfaceLayout
      reason: The page is moving out of the tab/root layer and no longer needs a parallax figure/header.
    - pattern: AppCard sections
      reason: The requested direction is a single white surface where spacing and headers provide grouping.
    - pattern: Bottom sheet
      reason: The content is multi-section diagnostics, not a bounded reversible choice.
  uncertainty:
    - Mock labels and metrics come from the current Node Status screen; final provider mapping will happen during route migration.
