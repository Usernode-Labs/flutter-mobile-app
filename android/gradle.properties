org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
android.enableJetifier=true
kotlin.version=2.2.0

# Enable Gradle optimizations
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Downgrade JVM target mismatch from error to warning
# This allows build to succeed even if some plugins use Java 8
kotlin.jvm.target.validation.mode=warning
