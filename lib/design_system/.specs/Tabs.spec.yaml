meta:
  figma_url: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=3012-2400"
  widget_name: "Tabs"
  description: >
    Complete tab view built from primitives. Combines tab bar (labels + optional
    inline badges + active indicator + divider) with swipeable content area via
    PageView. Supports fixed and scrollable tab modes. Manages own selection
    state internally; notifies parent via callback.
  generated_by: claude
  date: "2026-02-23"
  reference_screenshot: "Tabs.reference.txt"

# ── M3 Reference ──
m3_reference:
  tabs_source: "flutter/lib/src/material/tabs.dart — _TabsPrimaryDefaultsM3 (line 2665)"
  tab_controller_source: "flutter/lib/src/material/tab_controller.dart — TabController (line 100)"
  tab_bar_view_source: "flutter/lib/src/material/tabs.dart — TabBarView (line 2068)"
  badge_source: "flutter/lib/src/material/badge.dart — _BadgeDefaultsM3 (line 449)"
  key_constants:
    kTextTabBarHeight: 48
    _kTabHeight: 46
    kTabLabelPadding: "horizontal 16"
    kTabScrollDuration: "300ms"
    indicator_weight_label_sized: 3.0
    badge_large_size: 16
    badge_padding: "horizontal 4"

# ── Data model ──
data_model:
  TabItem:
    description: "Data class for a single tab definition"
    fields:
      - { name: label, type: String, required: true }
      - { name: badgeCount, type: "int?", required: false, description: "null or 0 = no badge" }

# ── Layout ──
layout:
  type: column
  cross_axis_alignment: stretch
  description: "Tab bar at top, content area fills remaining space"
  children:
    # ── Tab bar ──
    - type: container
      height: 48  # M3 kTextTabBarHeight
      description: "Tab bar — fixed (equal-width) or scrollable (natural-width)"
      children:
        - type: row_or_scroll
          description: >
            Fixed mode: Row with Expanded children.
            Scrollable mode: SingleChildScrollView + Row with natural-width children.
          children:
            - type: gesture_detector
              description: "Single tab (repeated per TabItem)"
              repeat: "{{tabs.length}}"
              layout:
                type: stack
                alignment: bottomCenter
                children:
                  - type: center
                    description: "Label + badge row"
                    child:
                      type: row
                      spacing: space4
                      main_axis_size: min
                      main_axis_alignment: center
                      cross_axis_alignment: center
                      children:
                        - type: text
                          value: "{{tab.label}}"
                          style: titleSmall
                          color_active: primary
                          color_inactive: onSurfaceVariant
                        - type: container
                          description: "Inline badge"
                          condition: "tab.badgeCount != null && tab.badgeCount! > 0"
                          height: 16  # M3 badge largeSize
                          min_width: 16
                          shape: StadiumBorder
                          padding: { horizontal: space4 }
                          decoration:
                            color: onSurface
                          child:
                            type: text
                            value: "{{tab.badgeCount}}"
                            style: labelSmall
                            color: surface
                  - type: container
                    description: "Active indicator bar — animated position"
                    condition: "isSelected"
                    height: 3
                    margin: { horizontal: 2 }
                    decoration:
                      color: primary
                      border_radius:
                        top_left: full
                        top_right: full
    # ── Divider ──
    - type: container
      height: 1
      decoration:
        color: outlineVariant
    # ── Content area ──
    - type: expanded
      child:
        type: page_view
        description: "Swipeable content area — one page per tab"
        controller: "_pageController"
        on_page_changed: "_handlePageChanged"
        children: "{{children}}"

# ── Internal state ──
state:
  description: "StatefulWidget with SingleTickerProviderStateMixin"
  fields:
    - _selectedIndex: int
    - _pageController: PageController
    - _animationController: AnimationController
    - _indicatorAnimation: "Animation<double>"
  behavior:
    - "Tab tap → update _selectedIndex, animate _pageController to page, animate indicator slide"
    - "Page swipe → update _selectedIndex, sync tab bar, sync indicator position from page scroll"
    - "Badge counts can change without resetting selection"
  indicator_animation:
    description: "Smooth indicator slide between tabs using AnimationController"
    duration: "300ms (M3 kTabScrollDuration)"
    curve: "easeInOut"
    drives: "indicator horizontal offset (fractional index)"
    sync: "PageView scroll position drives indicator in real-time during swipe"

# ── Dropped M3 features ──
omitted:
  - icon_tabs: "Label only"
  - secondary_variant: "Primary only"
  - hover_focus_overlay: "Mobile-first"
  - external_TabController: "Internal state management; no ChangeNotifier exposed"
  # indicator_slide_animation included in v1
  - text_scale_handling: "Skipped"

# ── Constructor params ──
params:
  - { name: tabs, type: "List<TabItem>", required: true, description: "Tab definitions (label + optional badge count)" }
  - { name: children, type: "List<Widget>", required: true, description: "Content widget for each tab" }
  - { name: initialIndex, type: int, required: false, default: "0", description: "Starting tab index" }
  - { name: onTabChanged, type: "ValueChanged<int>?", required: false, description: "Called when selected tab changes (tap or swipe)" }
  - { name: isScrollable, type: bool, required: false, default: "false", description: "true = natural-width scrollable tabs; false = equal-width fixed tabs" }

