meta:
  figma_url: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=2943-19310"
  widget_name: "ChallengeCard"
  description: >
    A challenge card showing title, description, category badge, date range,
    and a reward bar. Four state variants (active, ongoing, completed, missed)
    and three category colors (technical, community, flash).
  generated_by: claude
  date: "2026-02-23"
  reference_screenshot: "ChallengeCard.reference.png"

# The Figma node (2943:19310) is a list of cards in a Column.
# The repeating unit — and the design system widget — is a single ChallengeCard.
# The list layout (Column, gap space16, horizontal padding space16) is the screen's responsibility.

# ── Enums ──
enums:
  ChallengeCardVariant:
    - active       # available to join (default state)
    - ongoing      # user participating, daily updating
    - completed    # completed by user
    - missed       # expired, user didn't complete

  ChallengeCategory:
    - technical    # → semantic.technical (blue)
    - community    # → semantic.community (green)
    - flash        # → semantic.flash (amber)

# ── Layout ──
layout:
  type: column
  spacing: none  # no internal gap — children are stacked sections
  padding: { all: none }
  decoration:
    color: surfaceContainerLowest  # white card background
    border_radius: largeIncreased  # Figma 20px → exact match with new token
    elevation: low  # shadow 0px 1px 2px rgba(0,0,0,0.05)
    border:
      color: null  # variant-dependent — see variants section
      width: 0
  clip: true  # overflow: clip on the card
  children:
    # ── Top content section ──
    - type: container
      name: content_section
      padding: { top: space16, bottom: space24, left: space16, right: none }
      children:
        - type: column
          spacing: space8
          cross_axis_alignment: start
          children:
            # ── Header row: date range | category + icon ──
            - type: row
              main_axis_alignment: spaceBetween
              cross_axis_alignment: center
              children:
                - type: text
                  content: "{{dateRange}}"
                  style: labelSmall
                  color: onSurfaceVariant
                  text_transform: uppercase
                  letter_spacing: 0.28
                - type: row
                  spacing: space8
                  cross_axis_alignment: center
                  padding: { right: space16 }
                  children:
                    - type: text
                      content: "{{category.name.toUpperCase()}}"
                      style: labelSmall
                      color: onSurfaceVariant
                      text_transform: uppercase
                      letter_spacing: 0.28
                    - type: custom
                      widget: "{{categoryIcon}}"
                      size: iconContainerRegular  # 48px

            # ── Title ──
            - type: text
              content: "{{title}}"
              style: titleSmall
              color: onSurface

            # ── Description ──
            - type: text
              content: "{{description}}"
              style: bodySmall
              color: onSurface

    # ── Reward bar section (variant-dependent) ──
    - type: container
      name: reward_bar
      padding: { all: space16 }
      decoration:
        color: null  # variant-dependent — see variants section
      children:
        - type: row
          main_axis_alignment: spaceBetween
          cross_axis_alignment: center
          children: "{{variant-dependent — see variants section}}"

# ── Card state variants ──
variants:
  active:
    description: "Available to join — subtle border, transparent reward bar, potential reward shown"
    card_border:
      color: outlineVariant  # subtle, felt-not-seen
      width: 1
    card_background: surfaceContainerLowest
    content_text_color: onSurface
    reward_bar_color: transparent
    reward_bar_children:
      left:
        - { text: "{{rewardText}}", style: bodySmall, color: onSurface }

  ongoing:
    description: "User participating — animated gradient stroke in category color, colored reward bar with earned/epoch points"
    card_border:
      animated: true  # see animated_border section below
      color: "semantic.{{category}}.color"
      width: 2
    card_background: surfaceContainerLowest
    content_text_color: onSurface
    reward_bar_color: "semantic.{{category}}.color"
    reward_bar_children:
      left:
        - { icon: check_circle, size: iconSmall, color: "semantic.{{category}}.onColor" }
        - { text: "Earned {{earnedPoints}}", style: bodySmall, color: "semantic.{{category}}.onColor" }
      right:
        - { text: "Current Epoch {{epochPoints}}", style: bodySmall, color: "semantic.{{category}}.onColor" }

  completed:
    description: "Completed by user — no border, muted text, grey reward bar, checkmark"
    card_border: none
    card_background: surfaceContainerLowest
    content_text_color: onSurfaceVariant  # demoted from onSurface for visual quieting
    reward_bar_color: surfaceContainerHigh
    reward_bar_children:
      left:
        - { icon: check_circle, size: iconSmall, color: onSurface }
        - { text: "Completed", style: bodySmall, color: onSurface }
        - { text: "{{completedPoints}}", style: bodySmall, color: onSurface }

  missed:
    description: "Expired, user didn't complete — no border, tinted background, muted text, grey reward bar"
    card_border: none
    card_background: surfaceContainerLow  # elevated bg for double demotion
    content_text_color: onSurfaceVariant  # demoted from onSurface
    reward_bar_color: surfaceContainerHigh
    reward_bar_children:
      left:
        - { icon: event_busy, size: iconSmall, color: onSurfaceVariant }
        - { text: "Missed", style: bodySmall, color: onSurfaceVariant }
        - { text: "{{completedPoints}}", style: bodySmall, color: onSurfaceVariant }

# ── Ongoing animated border ──
animated_border:
  description: >
    The ongoing variant features an animated stroke that conveys continuous
    activity and draws attention as the single most important card.
  technique: "CustomPainter with SweepGradient rotating via AnimationController.repeat()"
  gradient: "transparent → category.color (full opacity) → transparent"
  effect: "Scanning beam that sweeps around the card perimeter"
  duration: "AppAnimation.complex (300ms) per full rotation"
  border_radius: "AppRadii.largeIncreased (20px) — matches card radius"
  fallback: "When animations are disabled (reduced motion), renders as a solid 2px border in category.color"

# ── Constructor params ──
params:
  - { name: title, type: String, required: true }
  - { name: description, type: String, required: true }
  - { name: dateRange, type: String, required: true }
  - { name: category, type: ChallengeCategory, required: true }
  - { name: categoryIcon, type: Widget, required: true }
  - { name: variant, type: ChallengeCardVariant, required: false, default: "ChallengeCardVariant.active" }
  - { name: rewardText, type: String, required: false }        # "Up to 1000 pts"
  - { name: earnedPoints, type: String, required: false }      # "10,550.1 pts"
  - { name: epochPoints, type: String, required: false }       # "+50 pts"
  - { name: completedPoints, type: String, required: false }   # "500 pts"
  - { name: onTap, type: "VoidCallback?", required: false }

# Note: categoryLabel removed — derived from category enum (.name.toUpperCase()).

# ── Token mappings ──
token_mappings:
  - { element: "Card background", token: "colorScheme.surfaceContainerLowest", confidence: exact }
  - { element: "Card border radius", token: "AppRadii.largeIncreased (20)", confidence: exact, note: "New token added to match Figma var(--corner/large-increased, 20px)" }
  - { element: "Card shadow", token: "AppElevation.low", confidence: exact }
  - { element: "Active border", token: "colorScheme.outlineVariant", confidence: exact }
  - { element: "Ongoing reward bar bg", token: "semantic.<category>.color", confidence: exact }
  - { element: "Ongoing reward bar text", token: "semantic.<category>.onColor", confidence: exact }
  - { element: "Completed/missed reward bar bg", token: "colorScheme.surfaceContainerHigh", confidence: exact }
  - { element: "Date/category text", token: "colorScheme.onSurfaceVariant", confidence: exact }
  - { element: "Title text", token: "textTheme.titleSmall", confidence: exact }
  - { element: "Body text", token: "textTheme.bodySmall", confidence: exact }
  - { element: "Card padding top", token: "AppSpacing.space16", confidence: exact }
  - { element: "Content padding bottom", token: "AppSpacing.space24", confidence: exact }
  - { element: "Content padding left", token: "AppSpacing.space16", confidence: exact }
  - { element: "Reward bar padding", token: "AppSpacing.space16", confidence: exact }
  - { element: "Icon container", token: "AppSizing.iconContainerRegular (48)", confidence: exact }
  - { element: "Small icons (check, missed)", token: "AppSizing.iconSmall (20)", confidence: exact }
  - { element: "Completed/missed content text", token: "colorScheme.onSurfaceVariant", confidence: exact, note: "Color-based demotion replaces blanket Opacity" }
  - { element: "Missed card background", token: "colorScheme.surfaceContainerLow", confidence: exact, note: "Elevated bg for double demotion (bg + text)" }
