meta:
  name: ActivityScreen
  input_type: text-only
  reference: >
    Activity Inbox integration brief and the existing Widgetbook Activity feed
    prototype in this repository.
  text_only_override: true
  generated_by: codex
  date: "2026-07-20"

intent:
  summary: >
    A root-tab feed for important Usernode events. The first version presents
    validated Social development-run transitions and lets users mark unread
    records as read without inventing navigation into Social.
  scope: screen
  target: new

pattern_decision:
  operating_mode: review and triage
  session_shape: glanceable and interruptible
  trust_level: normal
  device_context: one-handed mobile first, small-screen safe
  screen_type: root tab
  navigation_model: >
    Fourth visible bottom-navigation destination when the Activity API is
    configured; existing hidden home-page indices remain unchanged.
  sheet_vs_dialog_vs_page: >
    Root page because Activity is a durable feed that users revisit and
    refresh, not a bounded choice or transient interruption.
  cta_placement: >
    Unread cards are the only row actions and mark the corresponding record as
    read. There is no primary page CTA.
  chosen_pattern: >
    Existing root-tab shell with TopStatusAppBar.large, RefreshIndicator,
    CustomScrollView, AppCard list rows, IconBadge status cues, and existing
    loading, error, and empty-state components.
  rejected_alternatives:
    - pattern: notification-style modal or sheet
      reason: Activity is persistent history and needs a stable navigation destination.
    - pattern: custom Activity design-system widget family
      reason: Existing cards, list rows, badges, and state components cover the first slice.
    - pattern: route every Social record on tap
      reason: No trusted mobile mapping for social.session.v1 has been agreed yet.
  uncertainty:
    - The exact assertion handoff and trusted Social route are intentionally deferred.
    - Push, offline persistence, archive, and resolution are outside this first version.

structure:
  app_bar: TopStatusAppBar.large with Activity title and existing profile/node actions
  content:
    loading: ShimmerHost with card-shaped ShimmerListTile rows
    error: FullPageErrorState with localized retry
    empty: EmptyState with inbox icon
    feed: AppCard rows separated by spacing.space12
  row:
    context: localized source and relative time
    title: locally derived from the validated event status and run mode
    body: locally derived from the validated status facts
    attention: unread dot plus semantic label; read rows are not actionable

token_mappings:
  - { element: horizontal screen margin, token: spacing.space16, confidence: exact }
  - { element: card gap, token: spacing.space12, confidence: exact }
  - { element: bottom scroll padding, token: spacing.space32, confidence: exact }
  - { element: card surface, token: colorScheme.surfaceContainerLowest, confidence: exact }
  - { element: status leading, token: IconBadge defaults, confidence: exact }

implementation_notes:
  - All visible copy comes from AppLocalizations.
  - The client rejects unsupported or malformed contracts before presentation.
  - VIEW_ONLY keeps feed reads enabled and disables mark-read interactions.
  - No standalone /activity route is registered; the configured root tab is the only entry point.
