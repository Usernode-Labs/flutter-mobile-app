meta:
  name: TopStatusAppBar
  input_type: figma
  reference:
    large: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=3964-1802"
    compact: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=3964-1852"
    node_icons: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=3964-6154"
  text_only_override: false
intent:
  summary: >
    Build a native-M3-rooted top app bar for the active challenge surface. The
    large variant uses Figma-style tonal pill buttons for profile and node
    status that continuously morph into tonal icon buttons on scroll. The app
    bar remains a pinned sliver and mirrors Flutter Material 3 large app-bar
    geometry for safe-area, collapse, title, and toolbar measurements.
  scope: widget
  target: new
pattern_decision:
  operating_mode: exploration / glance status
  session_shape: interruptible mobile scanning
  trust_level: normal
  device_context: one-handed mobile first, compact-width safe
  chosen_pattern: >
    Compose a `SliverPersistentHeaderDelegate` that mirrors Flutter Material 3
    large app-bar measurements with design-system status-action slots. Large
    actions use M3 tonal-button visual language at 40dp and morph to tonal icon
    buttons; compact uses the collapsed icon-button treatment.
  cta_placement: no primary CTA; profile and node are top-level utility actions
  escape_route: none required; buttons are navigation/status entry points, not modal traps
  rejected_alternatives:
    - pattern: Custom Stack overlay above page content
      reason: Reimplements app-bar semantics, safe-area handling, and collapse behavior.
    - pattern: Plain SliverAppBar.large leading/actions slots
      reason: Native slots do not expose the collapse fraction needed to morph product-specific pill actions into icon buttons.
    - pattern: Replace generic TopAppBar
      reason: Profile/node status semantics are product-specific, while `TopAppBar` is generic navigation chrome.
    - pattern: Text-only score action as the profile affordance
      reason: The action is semantically profile; the score text may be supporting content in the large pill only.
  uncertainty:
    - >
      Figma node 3964:6154 for node-state icons is an empty frame in the file
      API. Use the visible Figma synced icon (`check_circle`) plus brief-derived
      Material icons for connecting (`sync`) and offline (`wifi_off`).
    - >
      Use Material Symbols sharp glyphs for account and node state icons so the
      app-bar chrome matches the rest of the current mobile navigation system.
figma_observations:
  large:
    layout: vertical app bar, 40dp visual action row, title content below
    profile_action: tonal pill, account_circle icon, "25k pts" label
    node_action: tonal pill, "Synced" label, check_circle icon
    title: "Season 1"
    supporting_text: "Ends in 21d"
  compact:
    layout: 56dp centered small top app bar
    profile_action: tonal icon button, account_circle
    node_action: tonal icon button, check_circle
    title: "Season 1"
tokens:
  spacing:
    top_row_outer_padding: space16
    large_title_padding: native SliverAppBar.large expanded title padding
  sizing:
    expanded_action_visual_height: buttonHeightSmall
    expanded_action_icon_size: iconSmall
    collapsed_action_visual_size: iconContainerSmall
    collapsed_action_icon_size: iconRegular
    action_touch_target: iconContainerRegular
  typography:
    large_title: headlineMedium matching native SliverAppBar.large
    compact_title: titleLarge
    button_label: labelLarge
  colors:
    expanded_app_bar_surface: transparent over the owning screen surface
    collapsed_app_bar_surface: ColorScheme.surfaceContainerLowest
    collapsed_bottom_border: AppBorders over ColorScheme.onSurface
    action_container: secondaryContainer via FilledButton/IconButton tonal defaults
    action_foreground: onSecondaryContainer via Material defaults
api:
  widget: TopStatusAppBar
  constructors:
    - TopStatusAppBar.large
    - TopStatusAppBar.compact
  parameters:
    - title: String
    - profileLabel: String?
    - nodeStatus: TopStatusNodeStatus
    - onProfilePressed: VoidCallback?
    - onNodePressed: VoidCallback?
    - backgroundColor: Color?
    - forceTransparent: bool
  notes:
    - >
      Supporting season metadata, if needed, belongs to the scroll content
      below the app bar. The active challenge bands story intentionally removes
      duplicate participant/deadline metadata so the app-bar title remains the
      only season header.
    - >
      The large app bar uses a custom sliver delegate only for the
      profile/node action morph. Measurements mirror Flutter Material 3 large
      app-bar defaults: 152dp expanded body, 64dp collapsed toolbar, and 16dp
      side gutters.
    - >
      The top surface fades in with the same collapse fraction so the compact
      state reads as native app-bar chrome while the expanded state stays
      visually integrated with the page. Use `surfaceContainerLowest` to match
      the bottom navigation bar's white chrome surface in ColorIsExpensiveTheme.
    - >
      The bottom border uses `AppBorders` and fades in with the collapsed
      surface so scrolled content has a clear edge without adding elevation.
