  # Job 2: Build iOS (only if not promoting)
  build-ios:
    name: Build iOS Release
    runs-on: macos-latest
    if: github.event.inputs.promote_to == 'none' || github.event.inputs.promote_to == ''
    env:
      DEBUG_LOGS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_logs == 'true' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Move usernode repository next to workspace
        run: |
          TARGET_DIR="../usernode"
          if [ -d "$TARGET_DIR" ]; then
            echo "⚠️  Existing $TARGET_DIR detected. Removing to ensure fresh checkout."
            rm -rf "$TARGET_DIR"
          fi
          mv usernode "$TARGET_DIR"

      - name: Determine flutter_rust_bridge revision
        id: frb_rev
        run: |
          FRB_REV=$(grep -m1 'flutter_rust_bridge =' ../usernode/crates/usernode/Cargo.toml | sed -E 's/.*rev = "([^"]+)".*/\1/')
          if [ -z "$FRB_REV" ]; then
            echo "Unable to find flutter_rust_bridge rev in Cargo.toml" >&2
            exit 1
          fi
          echo "rev=$FRB_REV" >> "$GITHUB_OUTPUT"
          echo "Using flutter_rust_bridge rev: $FRB_REV"
      - name: Verify usernode checkout and structure
        if: env.DEBUG_LOGS == 'true'
        run: |
          echo "📍 Current directory: $(pwd)"
          echo "📁 Listing root work directory..."
          ls -la ../
          echo ""
          echo "📁 Checking usernode directory..."
          ls -la ../usernode/ || echo "❌ usernode directory not found"
          echo ""
          echo "📁 Checking usernode/crates..."
          ls -la ../usernode/crates/ || echo "❌ usernode/crates not found"
          echo ""
          echo "📁 Checking for Cargo.toml..."
          ls -la ../usernode/crates/usernode/Cargo.toml || echo "❌ Cargo.toml not found"
          echo ""
          echo "✅ Path verification complete"

      - name: Setup jq
        run: brew install jq

      - name: Increment build number
        id: version
        run: |
          chmod +x scripts/version_manager.sh
          # Use production build counter (shared across all tracks)
          BUILD_NUMBER=$(scripts/version_manager.sh increment production)
          VERSION=$(scripts/version_manager.sh get production)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION (build $BUILD_NUMBER)"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build to ${{ steps.version.outputs.build_number }} [skip ci]" || true
          git push || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install cargo-expand
        run: cargo install cargo-expand --locked

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --git https://github.com/Usernode-Labs/flutter_rust_bridge --rev ${{ steps.frb_rev.outputs.rev }} --locked

      - name: Generate flutter_rust_bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Verify flutter_rust_bridge bindings are up-to-date
        run: |
          cd ../usernode
          if ! git diff --quiet -- crates/usernode/src/frb_generated.rs; then
            echo "::error::frb_generated.rs changed during CI. Run flutter_rust_bridge_codegen generate and commit the result in the usernode repo."
            git status --short crates/usernode/src/frb_generated.rs
            exit 1
          fi

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          if [ "${DEBUG_LOGS}" = "true" ]; then
            echo "📍 Running pod install from: $(pwd)"
            echo "📁 Listing ios directory before pod install..."
            ls -la
            echo ""
            echo "🔧 Running pod install with verbose output..."
            pod install --verbose 2>&1 | tee pod-install.log
            echo ""
            echo "📁 Checking Pods directory..."
            ls -la Pods/ | head -20
          else
            pod install
          fi
          echo "✅ Pod install complete"

      - name: Install Fastlane
        run: gem install fastlane

      - name: Import signing certificate
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
        run: |
          echo "$CERTIFICATES_P12" | base64 -d > certificate.p12
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATES_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profiles
        env:
          PROVISIONING_PROFILES: ${{ secrets.PROVISIONING_PROFILES }}
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"
          RAW_PROFILE=$(mktemp "$PROFILE_DIR/profile.XXXXXX.mobileprovision")
          echo "$PROVISIONING_PROFILES" | base64 -d > "$RAW_PROFILE"
          PLIST_PATH=$(mktemp "$PROFILE_DIR/profile.XXXXXX.plist")
          security cms -D -i "$RAW_PROFILE" > "$PLIST_PATH"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST_PATH" 2>/dev/null || true)
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST_PATH" 2>/dev/null || true)
          rm -f "$PLIST_PATH"
          if [ -n "$UUID" ]; then
            DEST="$PROFILE_DIR/$UUID.mobileprovision"
            mv "$RAW_PROFILE" "$DEST"
            echo "✅ Installed provisioning profile: ${NAME:-Unknown} ($UUID)"
          else
            echo "::warning::Unable to determine provisioning profile UUID. Keeping default file name."
          fi

      - name: Determine environment based on branch
        id: env_config
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "env_type=PROD" >> $GITHUB_OUTPUT
            echo "📦 Building iOS for PRODUCTION (main branch)"
          else
            echo "env_type=NONPROD" >> $GITHUB_OUTPUT
            echo "📦 Building iOS for NON-PRODUCTION (develop branch)"
          fi

      - name: Create .env file from secrets
        run: |
          if [ "${{ steps.env_config.outputs.env_type }}" == "PROD" ]; then
            cat > .env << EOF
          APP_ENV=${{ secrets.PROD_APP_ENV }}
          API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.PROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.PROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.PROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.PROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.PROD_DISABLED_FEATURES }}
          EOF
          else
            cat > .env << EOF
          APP_ENV=${{ secrets.NONPROD_APP_ENV }}
          API_BASE_URL=${{ secrets.NONPROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.NONPROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.NONPROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.NONPROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.NONPROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.NONPROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.NONPROD_DISABLED_FEATURES }}
          EOF
          fi
          echo "✅ Created .env file with ${{ steps.env_config.outputs.env_type }} secrets"

      - name: Verify Rust library before iOS build
        if: env.DEBUG_LOGS == 'true'
        run: |
          echo "🔍 Searching for Rust libraries in entire workspace..."
          find . -name "libusernode.a" 2>/dev/null || echo "❌ libusernode.a not found anywhere"
          find . -name "librust_lib_crypto_mobile_app.a" 2>/dev/null || echo "❌ librust_lib_crypto_mobile_app.a not found anywhere"
          echo ""
          echo "📁 Checking expected build location..."
          ls -la build/ios/Debug-iphoneos/rust_lib_crypto_mobile_app/ 2>/dev/null || echo "❌ Expected directory doesn't exist"
          echo ""
          echo "📁 Checking Pods build products..."
          find ios/Pods -name "*.a" 2>/dev/null | head -10 || echo "❌ No .a files found in Pods"
          echo ""
          echo "📁 Checking DerivedData if it exists..."
          find ~/Library/Developer/Xcode/DerivedData -name "libusernode.a" 2>/dev/null | head -5 || echo "ℹ️  No DerivedData or library not found there"

      - name: Build iOS IPA
        run: |
          FLUTTER_CMD=(
            flutter build ios
            --release
            --no-codesign
            --build-number=${{ steps.version.outputs.build_number }}
            --build-name=${{ steps.version.outputs.version }}
            --dart-define-from-file=.env
          )
          if [ "${DEBUG_LOGS}" = "true" ]; then
            FLUTTER_CMD+=(--verbose)
          fi
          "${FLUTTER_CMD[@]}"

      - name: Build and upload to TestFlight (Internal)
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          fastlane ios release flavor:production

  # Job 3: Promote existing build to higher track (develop builds only)
  promote:
    name: Promote to ${{ github.event.inputs.promote_to }}
    runs-on: ubuntu-latest
    if: github.event.inputs.promote_to != 'none' && github.event.inputs.promote_to != '' && github.event.inputs.promote_to != 'production'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup jq
        run: sudo apt-get install -y jq

      - name: Get build info
        id: build_info
        run: |
          chmod +x scripts/version_manager.sh
          if [ -z "${{ github.event.inputs.build_number }}" ]; then
            # Use latest production build
            BUILD_NUMBER=$(scripts/version_manager.sh get-build production)
          else
            BUILD_NUMBER="${{ github.event.inputs.build_number }}"
          fi
          VERSION=$(scripts/version_manager.sh get production)
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🚀 Promoting build $BUILD_NUMBER to ${{ github.event.inputs.promote_to }}"

      - name: Download artifact from previous build
        uses: actions/download-artifact@v4
        with:
          name: android-release-${{ steps.build_info.outputs.build_number }}
          path: ./artifacts/
        continue-on-error: true

      - name: Promote on Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.usernode.app
          track: internal
          promoteTrack: ${{ github.event.inputs.promote_to == 'production' && 'production' || github.event.inputs.promote_to }}
          status: completed
          inAppUpdatePriority: ${{ github.event.inputs.promote_to == 'production' && '5' || '2' }}

      - name: Create GitHub Release (if production)
        if: github.event.inputs.promote_to == 'production'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create tag
          git tag -a "v${{ steps.build_info.outputs.version }}" -m "Release v${{ steps.build_info.outputs.version }}"
          git push origin "v${{ steps.build_info.outputs.version }}"

          # Generate release notes
          chmod +x scripts/generate_release_notes.sh
          ./scripts/generate_release_notes.sh generate "" HEAD markdown > release_notes.md

          # Create GitHub release
          gh release create "v${{ steps.build_info.outputs.version }}" \
            --title "Release v${{ steps.build_info.outputs.version }}" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Notify team
  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [build-ios, promote]
    if: always()
    steps:
      - name: Determine status and action
        id: status
        run: |
          if [ "${{ github.event.inputs.promote_to }}" != "none" ] && [ "${{ github.event.inputs.promote_to }}" != "" ]; then
            ACTION="promoted to ${{ github.event.inputs.promote_to }}"
            BUILD="${{ needs.promote.outputs.build_number || github.event.inputs.build_number }}"
          else
            ACTION="built iOS and deployed to TestFlight"
            BUILD="${{ needs.build-ios.outputs.build_number }}"
          fi

          if [ "${{ needs.build-ios.result }}" == "failure" ] || [ "${{ needs.promote.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi

          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"${{ steps.status.outputs.emoji }} Build ${{ steps.status.outputs.build }} ${{ steps.status.outputs.action }} - ${{ steps.status.outputs.status }}\",
              \"blocks\": [
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Build ${{ steps.status.outputs.action }}*\\n\\n*Build:* ${{ steps.status.outputs.build }}\\n*Status:* ${{ steps.status.outputs.status }}\\n*Trigger:* ${{ github.event_name }}\"
                  }
                }
              ]
            }"
