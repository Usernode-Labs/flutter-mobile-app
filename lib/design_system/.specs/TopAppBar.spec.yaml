meta:
  figma_url_small: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=2994:2764"
  figma_url_large: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=2943:28629"
  widget_name: "TopAppBar"
  description: >
    A sliver-based top app bar with two size variants. Small is a standard 56px M3
    top app bar (back arrow + title + trailing actions). Large is an expanded header
    (back arrow + 64px image + display title + subtitle) that collapses to small on
    scroll. Wraps SliverAppBar — must be placed inside CustomScrollView.
  generated_by: claude
  date: "2026-02-24"
  reference_screenshot: "TopAppBar.reference.txt"

# ── Enums ──
enums:
  TopAppBarSize:
    - small  # standard 56px M3 top app bar
    - large  # expanded header with image + subtitle, collapses to small on scroll

# ── Layout ──
layout:
  small:
    type: sliver_app_bar
    pinned: true
    height: 56
    background_color: surface
    scrolled_under_elevation: 0
    padding: { top: space8, bottom: space8, left: space4, right: space16 }
    children:
      - type: row
        main_axis_alignment: spaceBetween
        cross_axis_alignment: center
        children:
          - type: icon_button
            name: leading
            icon: arrow_back
            touch_target: iconContainerRegular  # 48px
            visible_size: iconContainerSmall  # 40px
            icon_size: iconRegular  # 24px
            shape: circle
          - type: text
            content: "{{title}}"
            style: titleLarge
            color: onSurface
            overflow: ellipsis
            expanded: true  # fills available space between leading and actions
          - type: slot
            name: actions
            description: "List<Widget> — trailing action widgets (chips, icon buttons, etc.)"

  large:
    type: sliver_app_bar
    pinned: true
    expanded_height: ~232  # approximate, content-dependent
    background_color: surface
    scrolled_under_elevation: 0
    collapsed_state: "Identical to small variant (56px, titleLarge title)"
    children:
      # ── Top row (always visible, becomes the pinned bar on collapse) ──
      - type: row
        name: top_row
        height: 56
        padding: { top: space8, left: space4, right: space4 }
        children:
          - type: icon_button
            name: leading
            icon: arrow_back
            touch_target: iconContainerRegular  # 48px
            visible_size: iconContainerSmall  # 40px
            icon_size: iconRegular  # 24px
            shape: circle
          - type: spacer
          - type: slot
            name: actions
            description: "List<Widget> — trailing action widgets (icon buttons, etc.)"

      # ── Expanded content (fades out on collapse) ──
      - type: column
        name: expanded_content
        spacing: space16
        padding: { bottom: space12 }
        animation: "Fades out as user scrolls; title transitions from displaySmall to titleLarge"
        children:
          - type: container
            name: image_container
            condition: "image != null"
            size: iconContainerXLarge  # 64px
            padding: { left: space16, right: space16 }
            decoration:
              border_radius: small  # 8px (snapped from Figma 10.67px)
              clip: true
            children:
              - type: slot
                name: image
                description: "Widget — 64px content area (challenge icon, avatar, etc.)"

          - type: column
            spacing: space8
            padding: { left: space16, right: space16 }
            children:
              - type: text
                content: "{{title}}"
                style: displaySmall
                color: onSurface
              - type: text
                content: "{{subtitle}}"
                condition: "subtitle != null"
                style: titleMedium
                color: onSurfaceVariant

# ── Collapse behavior ──
collapse_behavior:
  description: >
    Large variant collapses to small on scroll via SliverAppBar's built-in
    flexibleSpace mechanics. The expanded content (image, displaySmall title,
    subtitle) fades out. The pinned bar shows the title in titleLarge, matching
    the small variant exactly.
  technique: "SliverAppBar with pinned: true and custom flexibleSpace"
  expanded_title_style: displaySmall
  collapsed_title_style: titleLarge
  image_behavior: "Fades out during collapse"
  subtitle_behavior: "Fades out during collapse"

# ── Constructor params ──
params:
  - { name: title, type: String, required: true, description: "Primary title text" }
  - { name: size, type: TopAppBarSize, required: false, default: "TopAppBarSize.small", description: "Bar size variant" }
  - { name: leading, type: "Widget?", required: false, default: "back arrow IconButton", description: "Leading widget" }
  - { name: onLeadingTap, type: "VoidCallback?", required: false, description: "Back navigation callback" }
  - { name: actions, type: "List<Widget>?", required: false, description: "Trailing action widgets (icon buttons, chips, etc.)" }
  - { name: image, type: "Widget?", required: false, description: "Large variant only — 64px content area" }
  - { name: subtitle, type: "String?", required: false, description: "Large variant only — secondary text line" }

