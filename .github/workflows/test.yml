name: Test Suite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run tests every day at 6 AM UTC
    - cron: "0 6 * * *"

env:
  FLUTTER_VERSION: "3.35.7"

jobs:
  determine-frb-rev:
    name: Determine FRB Revision
    runs-on: ubuntu-20.04-16core2
    outputs:
      frb_rev: ${{ steps.get-frb-rev.outputs.frb_rev }}
      usernode_sha: ${{ steps.get-frb-rev.outputs.usernode_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Get FRB revision and usernode SHA
        id: get-frb-rev
        run: |
          cd usernode/crates/usernode
          USERNODE_SHA=$(git rev-parse HEAD)
          FRB_REV=$(grep 'flutter_rust_bridge =' Cargo.toml | sed -n 's/.*rev = "\([^"]*\)".*/\1/p')
          echo "frb_rev=$FRB_REV" >> $GITHUB_OUTPUT
          echo "usernode_sha=$USERNODE_SHA" >> $GITHUB_OUTPUT
          echo "FRB Revision: $FRB_REV"
          echo "Usernode SHA: $USERNODE_SHA"

  setup-rust-tools-android:
    name: Setup Rust Tools (Android)
    needs: determine-frb-rev
    uses: ./.github/workflows/setup-rust-tools-android.yml
    with:
      frb_rev: ${{ needs.determine-frb-rev.outputs.frb_rev }}
      usernode_ref: ${{ needs.determine-frb-rev.outputs.usernode_sha }}
    secrets: inherit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-20.04-16core2
    needs: [determine-frb-rev, setup-rust-tools-android]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Move usernode repository next to workspace
        run: |
          TARGET_DIR="../usernode"
          if [ -d "$TARGET_DIR" ]; then
            rm -rf "$TARGET_DIR"
          fi
          mv usernode "$TARGET_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: Restore cargo binaries from cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-cargo-bins-${{ needs.determine-frb-rev.outputs.frb_rev }}-v2

      - name: Cache FRB generated code
        uses: actions/cache@v4
        with:
          path: |
            lib/src/rust/frb_generated.dart
            lib/src/rust/api
          key: ${{ runner.os }}-frb-gen-${{ needs.determine-frb-rev.outputs.frb_rev }}-${{ needs.determine-frb-rev.outputs.usernode_sha }}

      - name: Install dependencies
        run: flutter pub get

      - name: Generate flutter_rust_bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Run unit tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-unit

      - name: Run widget tests
        run: flutter test --coverage test/widget_test.dart --reporter expanded

      - name: Generate coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          # Install lcov
          sudo apt-get install -y lcov

          # Calculate coverage percentage
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"

          # Fail if coverage is below 70%
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage is below 70%"
          else
            echo "✅ Coverage is above 70%"
          fi

      - name: Check results
        run: |
          echo "⏭️  All tests temporarily disabled"
          echo "✅ No tests to run"

      - name: Run iOS integration tests
        run: |
          echo "Will come later..."

      - name: Run Android integration tests
        run: |
          echo "Will come later..."
