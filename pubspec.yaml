---
name: crypto_mobile_app
description: A New Layer 1 Operated & Secured by users from their phones.
version: 1.0.0+1220
publish_to: none
environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.35.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: "^2.5.1"
  go_router: "^14.2.0"
  rust_lib_crypto_mobile_app:
    path: rust_builder
  flutter_rust_bridge:
    git:
      url: https://github.com/Usernode-Labs/flutter_rust_bridge
      ref: 229548e05286634674c29df08ef457e534e52b2e
      path: frb_dart
  path_provider: "^2.1.4"
  shared_preferences: "^2.2.3"
  flutter_secure_storage: "^10.3.1"
  sentry_flutter: "^9.7.0"
  http: "^1.1.0"
  package_info_plus: "^9.0.0"
  device_info_plus: "^9.0.0"
  freezed_annotation: "^2.4.4"
  logger: "^2.0.0"
  collection: any
  wakelock_plus: "^1.2.8"
  battery_plus: "^6.0.0"
  connectivity_plus: "7.0.0"
  permission_handler: "^11.0.0"
  crypto: "^3.0.3"
  url_launcher: "^6.2.0"
  webview_flutter: "^4.10.0"
  # Platform implementations imported directly to enable debug-only webview
  # inspection (Safari Web Inspector / chrome://inspect) in dapp webviews.
  webview_flutter_android: "^4.10.13"
  webview_flutter_wkwebview: "^3.23.7"
  flutter_markdown: "^0.7.6"
  material_symbols_icons: ^4.2906.0
  marionette_flutter: ^0.5.0
  file_picker: ^11.0.2
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
dev_dependencies:
  webview_flutter_platform_interface: ^2.14.0
  flutter_lints: "^5.0.0"
  flutter_test:
    sdk: flutter
  sentry_dart_plugin: ^3.4.0
  freezed: "^2.5.2"
  build_runner: "^2.4.11"
  flutter_launcher_icons: "^0.14.4"
  material_color_utilities: any
sentry:
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  wait_for_processing: true
  commits: false
flutter:
  uses-material-design: true
  generate: true
  assets:
  # Declared by file so the @2x/@3x variants resolve and src/ stays unbundled.
  - assets/brand/mark.png
  - assets/brand/wordmark.png
  fonts:
  - family: IBMPlexMono
    fonts:
    - asset: assets/fonts/IBMPlexMono-Regular.ttf
    - asset: assets/fonts/IBMPlexMono-Medium.ttf
      weight: 500
    - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
      weight: 600
# Masters are generated by tool/brand/build_icons.py from assets/brand/src/.
# Regenerate those before running `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/launcher/icon-light-1024.png
  android: true
  adaptive_icon_background: "#171717"
  adaptive_icon_foreground: assets/launcher/icon-adaptive-fg-1024.png
  # Padding is baked into the master so what we draw is what ships.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/launcher/icon-monochrome-1024.png
  ios: true
  # iOS 18 appearances. The dark master is transparent because the system
  # paints its own dark ground behind it.
  image_path_ios_dark_transparent: assets/launcher/icon-dark-1024.png
  image_path_ios_tinted_grayscale: assets/launcher/icon-tinted-1024.png
  background_color_ios: "#171717"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/launcher/icon-light-1024.png
  web:
    generate: true
    image_path: assets/launcher/icon-light-1024.png
    background_color: "#171717"
    theme_color: "#171717"
  windows:
    generate: true
    image_path: assets/launcher/icon-light-1024.png
    icon_size: 256
