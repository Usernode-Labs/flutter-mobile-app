name: PR Checks

on:
  pull_request:
    branches:
      - main
      - develop

env:
  FLUTTER_VERSION: "3.41.4"
  JAVA_VERSION: "17"
  NDK_VERSION: "29.0.14206865"

jobs:
  # Job 0: Determine versions before build
  determine-frb-rev:
    name: Determine Rust Versions
    runs-on: macos-latest
    outputs:
      frb_rev: ${{ steps.frb_rev.outputs.rev }}
      usernode_sha: ${{ steps.usernode_rev.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          ref: main
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Determine usernode revision
        id: usernode_rev
        run: |
          cd usernode
          SHA=$(git rev-parse HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Usernode commit: $SHORT_SHA"

      - name: Determine flutter_rust_bridge revision
        id: frb_rev
        run: |
          FRB_REV=$(grep -m1 'flutter_rust_bridge =' usernode/crates/usernode/Cargo.toml | sed -E 's/.*rev = "([^"]+)".*/\1/')
          if [ -z "$FRB_REV" ]; then
            echo "Unable to find flutter_rust_bridge rev in Cargo.toml" >&2
            exit 1
          fi
          echo "rev=$FRB_REV" >> "$GITHUB_OUTPUT"
          echo "Using flutter_rust_bridge rev: $FRB_REV"

  # Job 1: Setup Rust tools (reusable) for iOS
  setup-rust-tools:
    name: Setup Rust Tools for iOS
    needs: determine-frb-rev
    uses: ./.github/workflows/setup-rust-tools.yml
    secrets: inherit
    with:
      frb_rev: ${{ needs.determine-frb-rev.outputs.frb_rev }}
      usernode_ref: ${{ needs.determine-frb-rev.outputs.usernode_sha }}

  # Job 1b: Setup Rust tools for Android
  setup-rust-tools-android:
    name: Setup Rust Tools for Android
    needs: determine-frb-rev
    uses: ./.github/workflows/setup-rust-tools-android.yml
    secrets: inherit
    with:
      frb_rev: ${{ needs.determine-frb-rev.outputs.frb_rev }}
      usernode_ref: ${{ needs.determine-frb-rev.outputs.usernode_sha }}

  analyze:
    name: Code Analysis
    runs-on: ubuntu-20.04-16core2
    needs: [determine-frb-rev, setup-rust-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          ref: main
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Move usernode repository next to workspace
        run: |
          TARGET_DIR="../usernode"
          if [ -d "$TARGET_DIR" ]; then
            echo "⚠️  Existing $TARGET_DIR detected. Removing to ensure fresh checkout."
            rm -rf "$TARGET_DIR"
          fi
          mv usernode "$TARGET_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: Restore cargo binaries from cache
        uses: actions/cache/restore@v4
        id: cache-cargo-bins
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-cargo-bins-${{ needs.determine-frb-rev.outputs.frb_rev }}-v2

      - name: Install flutter_rust_bridge_codegen if not cached
        if: steps.cache-cargo-bins.outputs.cache-hit != 'true'
        run: |
          if ! command -v flutter_rust_bridge_codegen &> /dev/null; then
            echo "Installing flutter_rust_bridge_codegen..."
            cargo install flutter_rust_bridge_codegen --git https://github.com/Usernode-Labs/flutter_rust_bridge --rev ${{ needs.determine-frb-rev.outputs.frb_rev }} --locked
          else
            echo "flutter_rust_bridge_codegen already available"
          fi

      - name: Cache FRB generated code
        id: cache-frb-gen
        uses: actions/cache@v4
        with:
          path: |
            lib/src/rust/frb_generated.dart
            lib/src/rust/api
          key: ${{ runner.os }}-frb-gen-${{ needs.determine-frb-rev.outputs.frb_rev }}-${{ needs.determine-frb-rev.outputs.usernode_sha }}
          restore-keys: |
            ${{ runner.os }}-frb-gen-${{ needs.determine-frb-rev.outputs.frb_rev }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate flutter_rust_bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Check formatting
        run: dart format . --set-exit-if-changed

      - name: Analyze code
        run: flutter analyze

      - name: Design system lints
        run: |
          cd packages/ds_lints
          dart pub get
          dart run bin/lint.dart ../..

      - name: Check DESIGN_SYSTEM.md token frontmatter
        run: flutter test test/design_system/design_system_md_tokens_test.dart

      - name: Verify widget harness fixtures
        run: bash tool/verify-widget.sh --self-test

      - name: Verify changed design system widgets
        run: |
          changed_widgets=$(git diff --name-only --diff-filter=d "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" -- 'lib/design_system/src/*.dart')
          if [ -z "$changed_widgets" ]; then
            echo "No design system widget source changes."
            exit 0
          fi

          for file in $changed_widgets; do
            snake=$(basename "$file" .dart)
            case "$snake" in
              text_field)
                widget="DSTextField"
                ;;
              *)
                widget=$(echo "$snake" | perl -pe 's/(^|_)(.)/uc($2)/ge')
                ;;
            esac
            bash tool/verify-widget.sh "$widget"
          done

      - name: Run unit tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-20.04-16core2
    needs: [determine-frb-rev, setup-rust-tools-android]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup jq
        run: sudo apt-get install -y jq

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          ref: main
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Move usernode repository next to workspace
        run: |
          TARGET_DIR="../usernode"
          if [ -d "$TARGET_DIR" ]; then
            echo "⚠️  Existing $TARGET_DIR detected. Removing to ensure fresh checkout."
            rm -rf "$TARGET_DIR"
          fi
          mv usernode "$TARGET_DIR"

      - name: Cache usernode Rust target artifacts
        uses: actions/cache@v4
        with:
          path: ../usernode/target
          key: ${{ runner.os }}-usernode-target-${{ needs.determine-frb-rev.outputs.usernode_sha }}
          restore-keys: |
            ${{ runner.os }}-usernode-target-${{ needs.determine-frb-rev.outputs.frb_rev }}-
            ${{ runner.os }}-usernode-target-

      - name: Determine environment based on target branch
        id: env_config
        run: |
          if [ "${{ github.base_ref }}" == "main" ]; then
            echo "env_type=PROD" >> $GITHUB_OUTPUT
            echo "📦 PR targets main - using PRODUCTION secrets"
          else
            echo "env_type=NONPROD" >> $GITHUB_OUTPUT
            echo "📦 PR targets develop - using NON-PRODUCTION secrets"
          fi

      - name: Create .env file from secrets
        run: |
          if [ "${{ steps.env_config.outputs.env_type }}" == "PROD" ]; then
            cat > .env << EOF
          APP_ENV=${{ secrets.PROD_APP_ENV }}
          API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.PROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.PROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.PROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.PROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.PROD_DISABLED_FEATURES }}
          METRICS_ENABLED=${{ secrets.PROD_METRICS_ENABLED }}
          METRICS_ENDPOINT=${{ secrets.PROD_METRICS_ENDPOINT }}
          METRICS_HEALTH_ENDPOINT=${{ secrets.PROD_METRICS_HEALTH_ENDPOINT }}
          METRICS_INTERVAL=${{ secrets.PROD_METRICS_INTERVAL }}
          DEMO_ACCOUNTS_JSON=${{ secrets.PROD_DEMO_ACCOUNTS_JSON }}
          TESTNET_SEEDLIST_URL=${{ secrets.TESTNET_SEEDLIST_URL }}
          TESTNET_GENESIS_URL=${{ secrets.TESTNET_GENESIS_URL }}
          INTERNAL_SEEDLIST_URL=${{ secrets.INTERNAL_SEEDLIST_URL }}
          INTERNAL_GENESIS_URL=${{ secrets.INTERNAL_GENESIS_URL }}
          NETWORK_SWITCHER_CODE=${{ secrets.NETWORK_SWITCHER_CODE }}
          LOAD_GENESIS_NB_RETRIES=${{ secrets.LOAD_GENESIS_NB_RETRIES }}
          VERSION_CHECK_API_URL=${{ secrets.PROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.PROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          else
            cat > .env << EOF
          APP_ENV=${{ secrets.NONPROD_APP_ENV }}
          API_BASE_URL=${{ secrets.NONPROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.NONPROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.NONPROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.NONPROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.NONPROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.NONPROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.NONPROD_DISABLED_FEATURES }}
          METRICS_ENABLED=${{ secrets.NONPROD_METRICS_ENABLED }}
          METRICS_ENDPOINT=${{ secrets.NONPROD_METRICS_ENDPOINT }}
          METRICS_HEALTH_ENDPOINT=${{ secrets.NONPROD_METRICS_HEALTH_ENDPOINT }}
          METRICS_INTERVAL=${{ secrets.NONPROD_METRICS_INTERVAL }}
          DEMO_ACCOUNTS_JSON=${{ secrets.NONPROD_DEMO_ACCOUNTS_JSON }}
          TESTNET_SEEDLIST_URL=${{ secrets.TESTNET_SEEDLIST_URL }}
          TESTNET_GENESIS_URL=${{ secrets.TESTNET_GENESIS_URL }}
          INTERNAL_SEEDLIST_URL=${{ secrets.INTERNAL_SEEDLIST_URL }}
          INTERNAL_GENESIS_URL=${{ secrets.INTERNAL_GENESIS_URL }}
          NETWORK_SWITCHER_CODE=${{ secrets.NETWORK_SWITCHER_CODE }}
          LOAD_GENESIS_NB_RETRIES=${{ secrets.LOAD_GENESIS_NB_RETRIES }}
          VERSION_CHECK_API_URL=${{ secrets.NONPROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.NONPROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          fi
          echo "✅ Created .env file with ${{ steps.env_config.outputs.env_type }} secrets"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: Restore cargo binaries from cache
        uses: actions/cache/restore@v4
        id: cache-cargo-bins
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-cargo-bins-${{ needs.determine-frb-rev.outputs.frb_rev }}-v2

      - name: Cache FRB generated code
        id: cache-frb-gen
        uses: actions/cache@v4
        with:
          path: |
            lib/src/rust/frb_generated.dart
            lib/src/rust/api
          key: ${{ runner.os }}-frb-gen-${{ needs.determine-frb-rev.outputs.frb_rev }}-${{ needs.determine-frb-rev.outputs.usernode_sha }}
          restore-keys: |
            ${{ runner.os }}-frb-gen-${{ needs.determine-frb-rev.outputs.frb_rev }}-

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate flutter_rust_bridge bindings
        run: flutter_rust_bridge_codegen generate

      - name: Verify flutter_rust_bridge bindings are up-to-date
        run: |
          cd ../usernode
          if ! git diff --quiet -- crates/usernode/src/frb_generated.rs; then
            echo "::error::frb_generated.rs changed during CI. Run flutter_rust_bridge_codegen generate and commit the result in the usernode repo."
            git status --short crates/usernode/src/frb_generated.rs
            exit 1
          fi

      - name: Locate Android NDK
        id: ndk
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_ROOT" ]; then
            sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$sdkmanager" ]; then
              sdkmanager="$(command -v sdkmanager || true)"
            fi
            if [ -z "$sdkmanager" ]; then
              echo "Unable to locate sdkmanager for NDK install" >&2
              exit 1
            fi
            yes | "$sdkmanager" --install "ndk;${NDK_VERSION}"
          fi
          echo "ndk_root=$NDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "Using NDK at $NDK_ROOT"

      - name: Build Android APK (Debug)
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk_root }}
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_CXX="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CARGO_TARGET_AARCH64_LINUX_ANDROID_CC"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          export AWS_LC_SYS_CMAKE_BUILDER_aarch64_linux_android="1"
          CARGOKIT_ONLY_ANDROID_ARM64=1 flutter build apk \
            --debug \
            --dart-define-from-file=.env

  build-ios:
    name: Build iOS (Debug)
    runs-on: macos-latest
    needs: [determine-frb-rev, setup-rust-tools]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          ref: main
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Move usernode repository next to workspace
        run: |
          TARGET_DIR="../usernode"
          if [ -d "$TARGET_DIR" ]; then
            echo "⚠️  Existing $TARGET_DIR detected. Removing to ensure fresh checkout."
            rm -rf "$TARGET_DIR"
          fi
          mv usernode "$TARGET_DIR"

      - name: Cache usernode Rust target artifacts
        uses: actions/cache@v4
        with:
          path: ../usernode/target
          key: ${{ runner.os }}-usernode-target-${{ needs.determine-frb-rev.outputs.usernode_sha }}
          restore-keys: |
            ${{ runner.os }}-usernode-target-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: Setup Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Install host GMP dependencies (pkg-config)
        run: |
          brew install gmp mpfr pkg-config gawk m4 texinfo

      # - name: Setup sccache for Rust compilation
      #   uses: mozilla-actions/sccache-action@v0.0.3
      #   continue-on-error: true
      #   id: sccache-ios
      #
      # - name: Configure Rust to use sccache
      #   if: steps.sccache-ios.outcome == 'success'
      #   run: |
      #     echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      #     echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
      #     echo "✅ sccache enabled for Rust compilation"
      #
      # - name: Rust compilation without sccache
      #   if: steps.sccache-ios.outcome != 'success'
      #   run: |
      #     echo "⚠️  sccache setup failed, building without cache"

      - name: Restore cargo binaries from cache
        uses: actions/cache/restore@v4
        id: cache-cargo-bins
        with:
          path: |
            ~/.cargo/bin/cargo-expand
            ~/.cargo/bin/flutter_rust_bridge_codegen
          key: ${{ runner.os }}-cargo-bins-${{ needs.determine-frb-rev.outputs.frb_rev }}-v2

      - name: Install flutter_rust_bridge_codegen if not cached
        if: steps.cache-cargo-bins.outputs.cache-hit != 'true'
        run: |
          if ! command -v flutter_rust_bridge_codegen &> /dev/null; then
            echo "Installing flutter_rust_bridge_codegen..."
            cargo install flutter_rust_bridge_codegen --git https://github.com/Usernode-Labs/flutter_rust_bridge --rev ${{ needs.determine-frb-rev.outputs.frb_rev }} --locked
          else
            echo "flutter_rust_bridge_codegen already available"
          fi

      - name: Cache FRB generated code
        id: cache-frb-gen
        uses: actions/cache@v4
        with:
          path: |
            lib/src/rust/frb_generated.dart
            lib/src/rust/api
          key: ${{ runner.os }}-frb-gen-${{ needs.determine-frb-rev.outputs.frb_rev }}-${{ needs.determine-frb-rev.outputs.usernode_sha }}
          restore-keys: |
            ${{ runner.os }}-frb-gen-${{ needs.determine-frb-rev.outputs.frb_rev }}-

      - name: Determine environment based on target branch
        id: env_config
        run: |
          if [ "${{ github.base_ref }}" == "main" ]; then
            echo "env_type=PROD" >> $GITHUB_OUTPUT
            echo "📦 PR targets main - using PRODUCTION secrets"
          else
            echo "env_type=NONPROD" >> $GITHUB_OUTPUT
            echo "📦 PR targets develop - using NON-PRODUCTION secrets"
          fi

      - name: Create .env file from secrets
        run: |
          if [ "${{ steps.env_config.outputs.env_type }}" == "PROD" ]; then
            cat > .env << EOF
          APP_ENV=${{ secrets.PROD_APP_ENV }}
          API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.PROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.PROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.PROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.PROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.PROD_DISABLED_FEATURES }}
          METRICS_ENABLED=${{ secrets.PROD_METRICS_ENABLED }}
          METRICS_ENDPOINT=${{ secrets.PROD_METRICS_ENDPOINT }}
          METRICS_HEALTH_ENDPOINT=${{ secrets.PROD_METRICS_HEALTH_ENDPOINT }}
          METRICS_INTERVAL=${{ secrets.PROD_METRICS_INTERVAL }}
          VERSION_CHECK_API_URL=${{ secrets.PROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.PROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          else
            cat > .env << EOF
          APP_ENV=${{ secrets.NONPROD_APP_ENV }}
          API_BASE_URL=${{ secrets.NONPROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.NONPROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.NONPROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.NONPROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.NONPROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.NONPROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.NONPROD_DISABLED_FEATURES }}
          METRICS_ENABLED=${{ secrets.NONPROD_METRICS_ENABLED }}
          METRICS_ENDPOINT=${{ secrets.NONPROD_METRICS_ENDPOINT }}
          METRICS_HEALTH_ENDPOINT=${{ secrets.NONPROD_METRICS_HEALTH_ENDPOINT }}
          METRICS_INTERVAL=${{ secrets.NONPROD_METRICS_INTERVAL }}
          VERSION_CHECK_API_URL=${{ secrets.NONPROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.NONPROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          fi
          echo "✅ Created .env file with ${{ steps.env_config.outputs.env_type }} secrets"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate flutter_rust_bridge bindings
        env:
          GMP_MPFR_SYS_USE_PKG_CONFIG: "1"
          PKG_CONFIG_PATH: "/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig"
        run: |
          export PATH="/opt/homebrew/opt/texinfo/bin:$HOME/.cargo/bin:$PATH"
          flutter_rust_bridge_codegen generate

      - name: Verify flutter_rust_bridge bindings are up-to-date
        run: |
          cd ../usernode
          if ! git diff --quiet -- crates/usernode/src/frb_generated.rs; then
            echo "::error::frb_generated.rs changed during CI. Run flutter_rust_bridge_codegen generate and commit the result in the usernode repo."
            git status --short crates/usernode/src/frb_generated.rs
            exit 1
          fi

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          echo "✅ Pod install complete"

      - name: Build iOS
        run: |
          flutter build ios \
            --no-codesign \
            --dart-define-from-file=.env

      - name: Cache Statistics
        if: always()
        run: |
          echo "### PR Check Cache Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Cargo binaries cache hit: \`${{ steps.cache-cargo-bins.outputs.cache-hit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- FRB generated code cache hit: \`${{ steps.cache-frb-gen.outputs.cache-hit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- CocoaPods cache hit: \`${{ steps.cache-pods.outputs.cache-hit }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Rust tools setup cache hit: \`${{ needs.setup-rust-tools.outputs.cache-hit }}\`" >> $GITHUB_STEP_SUMMARY

  summary:
    name: PR Check Summary
    runs-on: ubuntu-20.04-16core2
    needs: [build-ios]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.build-ios.result }}" == "failure" ]; then
            echo "❌ iOS build failed"
            exit 1
          else
            echo "✅ iOS build passed"
          fi
