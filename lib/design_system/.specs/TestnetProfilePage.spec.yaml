meta:
  name: TestnetProfilePage
  input_type: figma
  reference: "https://www.figma.com/design/Eu4jn5o8finpZ28IAGPyru/Testnet-App?node-id=3964-5508&t=67rRAmjQSNltQwv2-4"
  text_only_override: false
  generated_by: codex
  date: "2026-06-12"

intent:
  summary: >
    Widgetbook-only prototype of the Testnet Profile detail page. The page
    combines the existing points gauge, an event/all-events dropdown affordance,
    completed challenge cards, and a leaderboard ranking list.
  scope: screen
  target: new

pattern_decision:
  operating_mode: exploration
  session_shape: glance
  trust_level: normal
  device_context: one-handed mobile first, small-screen safe
  chosen_pattern: >
    Widgetbook page demo composed from existing DS/M3 pieces: ScoreHeader,
    DropdownChip, Tabs, ChallengeCard, RankBadge, ListTile, and TopAppBar.
  navigation_model: no app route; Widgetbook-only prototype
  sheet_vs_page: >
    Page pattern for the visual prototype. The dropdown affordance is mocked
    and does not open a sheet in this pass.
  cta_placement: none; page is informational and uses tab navigation only
  escape_route: TopAppBar back affordance is shown for visual parity only
  rejected_alternatives:
    - pattern: app route with provider wiring
      reason: user selected Widgetbook-only scope
    - pattern: new custom profile component set
      reason: existing DS/M3 widgets cover the layout without a new pattern
    - pattern: full leaderboard stats card in Leaderboard tab
      reason: user selected ranking list only
  uncertainty:
    - Live period filtering and season switching are intentionally out of scope.

structure:
  app_bar:
    title: Profile
    actions:
      - settings icon button
  header:
    widget: ScoreHeader
    behavior:
      show_countdown: false
      footer: "DropdownChip(label: All Events, variant: outlined)"
      refresh_animation: disabled for this page
  tabs:
    - Completed Challenges
    - Leaderboard
  completed_challenges:
    data: mocked completed challenges
    widget: ChallengeCard
  leaderboard:
    data: mocked ranking entries
    widgets:
      - RankBadge
      - ListTile

token_mappings:
  - { element: screen background, token: colorScheme.surface, confidence: exact }
  - { element: top app bar, token: TopAppBar.small, confidence: exact }
  - { element: score gauge, token: ScoreHeader circle 160px, confidence: exact }
  - { element: period selector, token: DropdownChip outlined regular, confidence: exact }
  - { element: tabs, token: Tabs fixed primary, confidence: exact }
  - { element: horizontal screen margin, token: AppSpacing.space16, confidence: exact }
  - { element: card/list gaps, token: AppSpacing.space12 and space16, confidence: exact }
  - { element: bottom scroll padding, token: AppSpacing.space32, confidence: exact }

implementation_notes:
  - Do not add providers, services, app routes, or localization work in this pass.
  - Use mocked data in Widgetbook and import real DS widgets only.
  - Keep ScoreHeader changes backward compatible for the existing Challenges tab.
