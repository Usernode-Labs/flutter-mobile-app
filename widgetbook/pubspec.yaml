name: widgetbook_workspace
description: Widgetbook v4 workspace for the Usernode Design System.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^4.0.0-beta.3
  material_symbols_icons: ^4.2906.0
  flutter_markdown: "^0.7.6"
  crypto_mobile_app:
    path: ../

dev_dependencies:
  build_runner: ^2.10.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
