name: Build Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/prepare-frb-bindings.yml"
      - "assets/**"
      - "flutter_rust_bridge.yaml"
      - "lib/**"
      - "rust_builder/**"
      - "windows/**"
      - "pubspec.lock"
      - "pubspec.yaml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".github/workflows/build-desktop.yml"
      - ".github/workflows/prepare-frb-bindings.yml"
      - "assets/**"
      - "flutter_rust_bridge.yaml"
      - "lib/**"
      - "rust_builder/**"
      - "windows/**"
      - "pubspec.lock"
      - "pubspec.yaml"

permissions:
  contents: read

jobs:
  prepare-frb-bindings:
    name: Prepare FRB Bindings
    uses: ./.github/workflows/prepare-frb-bindings.yml
    secrets: inherit

  build-windows:
    name: Windows x64 release
    runs-on: windows-latest
    needs: prepare-frb-bindings
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated bindings
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-frb-bindings.outputs.artifact_name }}
          path: ${{ runner.temp }}/frb-bindings-artifact

      - name: Restore generated Dart bindings
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force lib/src/rust -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force lib/src/rust | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP/frb-bindings-artifact/dart/*" lib/src/rust/

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare-frb-bindings.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=APP_ENV=production

      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/artifacts/usernode-windows-x64.zip
          $hash = (Get-FileHash build/artifacts/usernode-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  usernode-windows-x64.zip" | Set-Content -NoNewline build/artifacts/usernode-windows-x64.zip.sha256

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: usernode-windows-x64
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14
