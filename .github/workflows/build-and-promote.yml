name: Build Once, Promote Many

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      promote_to:
        description: "Promote existing build to track"
        required: false
        type: choice
        options:
          - none
          - alpha
          - beta
          - production
        default: "none"
      build_number:
        description: "Build number to promote (leave empty to build new)"
        required: false
        type: string
      debug_logs:
        description: "Enable verbose logging before TestFlight upload"
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: "3.35.7"
  JAVA_VERSION: "17"

