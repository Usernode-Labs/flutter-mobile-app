name: Manual Build and Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit to build from"
        required: true
        type: string
        default: "develop"
      version:
        description: "Version name for this build (e.g., v1.2.3-rc1, beta-2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "29.0.14206865"
  XCODE_VERSION: "26.5"

jobs:
  check-tag:
    name: Check Tag Availability
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tag doesn't exist
        run: |
          TAG_NAME="${{ github.event.inputs.version }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "❌ Error: Tag '$TAG_NAME' already exists!"
            echo "Please choose a different version name or delete the existing tag first."
            exit 1
          fi
          echo "✅ Tag '$TAG_NAME' is available"

  prepare-frb-bindings:
    name: Prepare FRB Bindings
    needs: check-tag
    uses: ./.github/workflows/prepare-frb-bindings.yml
    secrets: inherit
    with:
      mobile_app_ref: ${{ github.event.inputs.ref }}

  build-android:
    name: Build Android App
    runs-on: ubuntu-20.04-16core2
    needs: [check-tag, prepare-frb-bindings]
    outputs:
      version: ${{ github.event.inputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-frb-bindings.outputs.mobile_app_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download generated bindings
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-frb-bindings.outputs.artifact_name }}
          path: ${{ runner.temp }}/frb-bindings-artifact

      - name: Restore generated Dart bindings
        run: |
          rm -rf lib/src/rust
          mkdir -p lib/src/rust
          cp -R "$RUNNER_TEMP/frb-bindings-artifact/dart/." lib/src/rust/

      - name: Setup jq
        run: sudo apt-get install -y jq

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          ref: ${{ needs.prepare-frb-bindings.outputs.usernode_sha }}
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Move usernode repository next to workspace
        run: |
          TARGET_DIR="../usernode"
          if [ -d "$TARGET_DIR" ]; then
            echo "⚠️  Existing $TARGET_DIR detected. Removing to ensure fresh checkout."
            rm -rf "$TARGET_DIR"
          fi
          mv usernode "$TARGET_DIR"

      - name: Restore generated Rust binding
        run: cp "$RUNNER_TEMP/frb-bindings-artifact/rust/frb_generated.rs" ../usernode/crates/usernode/src/frb_generated.rs

      - name: Resolve usernode target path
        id: usernode-paths
        run: echo "target=$(cd ../usernode && pwd -P)/target" >> "$GITHUB_OUTPUT"

      - name: Determine environment from ref
        id: env_config
        run: |
          REF="${{ github.event.inputs.ref }}"
          case "$REF" in
            main|refs/heads/main|origin/main|refs/tags/*)
              echo "env_type=PROD" >> $GITHUB_OUTPUT
              echo "track=production" >> $GITHUB_OUTPUT
              echo "aab_path=build/app/outputs/bundle/release/app-release.aab" >> $GITHUB_OUTPUT
              echo "📦 Building for PRODUCTION ($REF)"
              ;;
            *)
              echo "env_type=NONPROD" >> $GITHUB_OUTPUT
              echo "track=internal" >> $GITHUB_OUTPUT
              echo "aab_path=build/app/outputs/bundle/release/app-release.aab" >> $GITHUB_OUTPUT
              echo "📦 Building for NON-PRODUCTION ($REF)"
              ;;
          esac

      - name: Cache usernode Rust target artifacts
        uses: actions/cache@v4
        with:
          path: ${{ steps.usernode-paths.outputs.target }}
          key: ${{ runner.os }}-usernode-target-android-v1-${{ needs.prepare-frb-bindings.outputs.usernode_sha }}
          restore-keys: |
            ${{ runner.os }}-usernode-target-frb-v1-${{ needs.prepare-frb-bindings.outputs.usernode_sha }}
            ${{ runner.os }}-usernode-target-android-v1-

      - name: Create .env file from secrets
        run: |
          if [ "${{ steps.env_config.outputs.env_type }}" == "PROD" ]; then
            cat > .env << EOF
          APP_ENV=${{ secrets.PROD_APP_ENV }}
          API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.PROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.PROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.PROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.PROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.PROD_DISABLED_FEATURES }}
          VERSION_CHECK_API_URL=${{ secrets.PROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.PROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          else
            cat > .env << EOF
          APP_ENV=${{ secrets.NONPROD_APP_ENV }}
          API_BASE_URL=${{ secrets.NONPROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.NONPROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.NONPROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.NONPROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.NONPROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.NONPROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.NONPROD_DISABLED_FEATURES }}
          VERSION_CHECK_API_URL=${{ secrets.NONPROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.NONPROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          fi
          echo "✅ Created .env file with ${{ steps.env_config.outputs.env_type }} secrets"

      - name: Provision Social push Android client
        env:
          SOCIAL_PUSH_ENV_TYPE: ${{ steps.env_config.outputs.env_type }}
          PROD_SOCIAL_PUSH_REQUIRED: ${{ vars.PROD_SOCIAL_PUSH_REQUIRED || 'false' }}
          NONPROD_SOCIAL_PUSH_REQUIRED: ${{ vars.NONPROD_SOCIAL_PUSH_REQUIRED || 'false' }}
          PROD_PUSH_ENV: ${{ vars.PROD_PUSH_ENV }}
          NONPROD_PUSH_ENV: ${{ vars.NONPROD_PUSH_ENV }}
          PROD_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
          NONPROD_FIREBASE_PROJECT_ID: ${{ vars.NONPROD_FIREBASE_PROJECT_ID }}
          PROD_MOBILE_API_BASE_URL: ${{ vars.PROD_MOBILE_API_BASE_URL }}
          NONPROD_MOBILE_API_BASE_URL: ${{ vars.NONPROD_MOBILE_API_BASE_URL }}
          PROD_FIREBASE_CLIENT_CONFIG_BASE64: ${{ secrets.PROD_FIREBASE_ANDROID_CONFIG_BASE64 }}
          NONPROD_FIREBASE_CLIENT_CONFIG_BASE64: ${{ secrets.NONPROD_FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: bash tool/provision-social-push-build.sh android

      - name: Set custom version
        id: version
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((1000 + ${GITHUB_RUN_NUMBER}))
          VERSION_INPUT="${{ github.event.inputs.version }}"
          VERSION_SANITIZED="${VERSION_INPUT#v}"
          VERSION_NUMBER="${VERSION_SANITIZED%%+*}"
          if [ -z "$VERSION_NUMBER" ]; then
            echo "Invalid version input: $VERSION_INPUT" >&2
            exit 1
          fi
          FULL_VERSION="${VERSION_NUMBER}+${BUILD_NUMBER}"
          sed -i "s/^version: .*/version: ${FULL_VERSION}/" pubspec.yaml
          echo "version=$VERSION_INPUT" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "📦 Building custom version: $VERSION_INPUT -> ${FULL_VERSION}"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare-frb-bindings.outputs.flutter_version }}
          channel: "stable"
          cache: false

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Locate Android NDK
        id: ndk
        run: |
          set -euo pipefail
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          if [ ! -d "$NDK_ROOT" ]; then
            sdkmanager="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
            if [ ! -x "$sdkmanager" ]; then
              sdkmanager="$(command -v sdkmanager || true)"
            fi
            if [ -z "$sdkmanager" ]; then
              echo "Unable to locate sdkmanager for NDK install" >&2
              exit 1
            fi
            yes | "$sdkmanager" --install "ndk;${NDK_VERSION}"
          fi
          echo "ndk_root=$NDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "Using NDK at $NDK_ROOT"

      # - name: Setup sccache for Rust compilation
      #   uses: mozilla-actions/sccache-action@v0.0.3
      #   continue-on-error: true
      #   id: sccache-android
      #
      # - name: Configure Rust to use sccache
      #   if: steps.sccache-android.outcome == 'success'
      #   run: |
      #     echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      #     echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
      #     echo "✅ sccache enabled for Rust compilation"
      #
      # - name: Rust compilation without sccache
      #   if: steps.sccache-android.outcome != 'success'
      #   run: |
      #     echo "⚠️  sccache setup failed, building without cache"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF

      - name: Build Android AAB
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.ndk_root }}
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_CXX="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CARGO_TARGET_AARCH64_LINUX_ANDROID_CC"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_AR="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          export AWS_LC_SYS_CMAKE_BUILDER_aarch64_linux_android="1"
          SPLIT_DEBUG_INFO_DIR="build/flutter_symbols/android/${{ steps.env_config.outputs.env_type }}-${{ steps.version.outputs.build_number }}"
          mkdir -p "$SPLIT_DEBUG_INFO_DIR"
          CARGOKIT_ONLY_ANDROID_ARM64=1 flutter build appbundle \
            --release \
            --split-debug-info="$SPLIT_DEBUG_INFO_DIR" \
            --build-number=${{ steps.version.outputs.build_number }} \
            --build-name=${{ steps.version.outputs.version_number }} \
            --dart-define-from-file=.env

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-manual-${{ github.event.inputs.version }}
          path: ${{ steps.env_config.outputs.aab_path }}
          retention-days: 90

      - name: Upload Flutter split debug info (Dart/AOT)
        uses: actions/upload-artifact@v4
        with:
          name: android-flutter-symbols-manual-${{ github.event.inputs.version }}
          path: build/flutter_symbols/android/${{ steps.env_config.outputs.env_type }}-${{ steps.version.outputs.build_number }}
          retention-days: 90

      # FIXME(2025-12-17): Temporarily disable Play Console symbol uploads.
      # This step hard-fails the workflow when the expected files are not generated:
      # - android/app/build/outputs/mapping/<variant>/mapping.txt
      # - android/app/build/outputs/native-debug-symbols/<variant>/native-debug-symbols.zip
      # Re-enable once the Android Gradle Plugin/Flutter build is confirmed to generate these
      # outputs for our release variants (e.g. internalRelease) in CI.
      # - name: Locate Play Console symbol files
      #   id: play_symbols
      #   run: |
      #     set -euo pipefail
      #     VARIANT="Release"
      #     MAPPING="android/app/build/outputs/mapping/$VARIANT/mapping.txt"
      #     SYMBOLS="android/app/build/outputs/native-debug-symbols/$VARIANT/native-debug-symbols.zip"
      #     if [ ! -f "$MAPPING" ]; then
      #       echo "R8 mapping.txt not found at $MAPPING" >&2
      #       ls -la "android/app/build/outputs/mapping" || true
      #       exit 1
      #     fi
      #     if [ ! -f "$SYMBOLS" ]; then
      #       echo "native-debug-symbols.zip not found at $SYMBOLS" >&2
      #       ls -la "android/app/build/outputs/native-debug-symbols" || true
      #       exit 1
      #     fi
      #     echo "mapping=$MAPPING" >> "$GITHUB_OUTPUT"
      #     echo "symbols=$SYMBOLS" >> "$GITHUB_OUTPUT"

      - name: Deploy to Google Play Internal Track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.usernode_labs.usernode
          releaseFiles: ${{ steps.env_config.outputs.aab_path }}
          # FIXME(2025-12-17): Re-enable when `Locate Play Console symbol files` is restored.
          # mappingFile: ${{ steps.play_symbols.outputs.mapping }}
          # debugSymbols: ${{ steps.play_symbols.outputs.symbols }}
          track: ${{ steps.env_config.outputs.track }}
          status: draft
          inAppUpdatePriority: ${{ steps.env_config.outputs.track == 'production' && '5' || '2' }}

  build-ios:
    name: Build iOS App
    runs-on: macos-26
    needs: [check-tag, prepare-frb-bindings]
    outputs:
      version: ${{ github.event.inputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-frb-bindings.outputs.mobile_app_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download generated bindings
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-frb-bindings.outputs.artifact_name }}
          path: ${{ runner.temp }}/frb-bindings-artifact

      - name: Restore generated Dart bindings
        run: |
          rm -rf lib/src/rust
          mkdir -p lib/src/rust
          cp -R "$RUNNER_TEMP/frb-bindings-artifact/dart/." lib/src/rust/

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks

      - name: Checkout usernode repository
        uses: actions/checkout@v4
        with:
          repository: Usernode-Labs/usernode
          path: usernode
          ref: ${{ needs.prepare-frb-bindings.outputs.usernode_sha }}
          token: ${{ secrets.USERNODE_ACCESS_TOKEN }}

      - name: Move usernode repository next to workspace
        run: |
          TARGET_DIR="../usernode"
          if [ -d "$TARGET_DIR" ]; then
            echo "⚠️  Existing $TARGET_DIR detected. Removing to ensure fresh checkout."
            rm -rf "$TARGET_DIR"
          fi
          mv usernode "$TARGET_DIR"

      - name: Restore generated Rust binding
        run: cp "$RUNNER_TEMP/frb-bindings-artifact/rust/frb_generated.rs" ../usernode/crates/usernode/src/frb_generated.rs

      - name: Resolve usernode target path
        id: usernode-paths
        run: echo "target=$(cd ../usernode && pwd -P)/target" >> "$GITHUB_OUTPUT"

      - name: Cache usernode Rust target artifacts
        uses: actions/cache@v4
        with:
          path: ${{ steps.usernode-paths.outputs.target }}
          key: ${{ runner.os }}-usernode-target-ios-v1-${{ needs.prepare-frb-bindings.outputs.usernode_sha }}
          restore-keys: |
            ${{ runner.os }}-usernode-target-ios-v1-

      - name: Determine environment from ref
        id: env_config
        run: |
          REF="${{ github.event.inputs.ref }}"
          case "$REF" in
            main|refs/heads/main|origin/main|refs/tags/*)
              echo "env_type=PROD" >> $GITHUB_OUTPUT
              echo "📦 Building iOS for PRODUCTION ($REF)"
              ;;
            *)
              echo "env_type=NONPROD" >> $GITHUB_OUTPUT
              echo "📦 Building iOS for NON-PRODUCTION ($REF)"
              ;;
          esac

      - name: Setup jq
        run: brew install jq

      - name: Install host GMP dependencies (pkg-config)
        run: |
          brew install gmp mpfr pkg-config gawk m4 texinfo

      - name: Set custom version
        id: version
        run: |
          set -euo pipefail
          BUILD_NUMBER=$((1000 + ${GITHUB_RUN_NUMBER}))
          VERSION_INPUT="${{ github.event.inputs.version }}"
          VERSION_SANITIZED="${VERSION_INPUT#v}"
          VERSION_NUMBER="${VERSION_SANITIZED%%+*}"
          if [ -z "$VERSION_NUMBER" ]; then
            echo "Invalid version input: $VERSION_INPUT" >&2
            exit 1
          fi
          FULL_VERSION="${VERSION_NUMBER}+${BUILD_NUMBER}"
          sed -i '' "s/^version: .*/version: ${FULL_VERSION}/" pubspec.yaml
          echo "version=$VERSION_INPUT" >> $GITHUB_OUTPUT
          echo "version_number=$VERSION_NUMBER" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "📦 Building custom version: $VERSION_INPUT -> ${FULL_VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare-frb-bindings.outputs.flutter_version }}
          channel: "stable"
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Rust for iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # - name: Setup sccache for Rust compilation
      #   uses: mozilla-actions/sccache-action@v0.0.3
      #   continue-on-error: true
      #   id: sccache-ios
      #
      # - name: Configure Rust to use sccache
      #   if: steps.sccache-ios.outcome == 'success'
      #   run: |
      #     echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
      #     echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
      #     echo "✅ sccache enabled for Rust compilation"
      #
      # - name: Rust compilation without sccache
      #   if: steps.sccache-ios.outcome != 'success'
      #   run: |
      #     echo "⚠️  sccache setup failed, building without cache"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          echo "✅ Pod install complete"

      - name: Import signing certificate
        env:
          CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
          CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$CERTIFICATES_P12" | base64 -d > certificate.p12

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import certificate.p12 -k "$KEYCHAIN" -P "$CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild -T /usr/bin/security

          EXISTING=$(security list-keychains -d user | tr -d ' "\n')
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          security default-keychain -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> $GITHUB_ENV

      - name: Verify signing identities
        run: security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          PROVISIONING_PROFILES: ${{ secrets.PROVISIONING_PROFILES }}
        run: |
          PROFILE_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILE_DIR"

          # Try to extract as tar.gz archive first
          if echo "$PROVISIONING_PROFILES" | base64 -d | tar -tzf - >/dev/null 2>&1; then
            echo "📦 Extracting provisioning profiles from tar.gz archive..."
            echo "$PROVISIONING_PROFILES" | base64 -d | tar -xzf - -C "$PROFILE_DIR"
          else
            # If not a tar.gz, assume it's a single .mobileprovision file
            echo "📄 Installing single provisioning profile..."
            echo "$PROVISIONING_PROFILES" | base64 -d > "$PROFILE_DIR/profile.mobileprovision"
          fi

          echo "✅ Installed provisioning profiles"
          ls -la "$PROFILE_DIR"

      - name: Create .env file from secrets
        run: |
          if [ "${{ steps.env_config.outputs.env_type }}" == "PROD" ]; then
            cat > .env << EOF
          APP_ENV=${{ secrets.PROD_APP_ENV }}
          API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.PROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.PROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.PROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.PROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.PROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.PROD_DISABLED_FEATURES }}
          VERSION_CHECK_API_URL=${{ secrets.PROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.PROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          else
            cat > .env << EOF
          APP_ENV=${{ secrets.NONPROD_APP_ENV }}
          API_BASE_URL=${{ secrets.NONPROD_API_BASE_URL }}
          VERBOSE_LOGGING=${{ secrets.NONPROD_VERBOSE_LOGGING }}
          SENTRY_DSN=${{ secrets.NONPROD_SENTRY_DSN }}
          GITHUB_TOKEN=${{ secrets.NONPROD_GITHUB_TOKEN }}
          USE_RESULT_PROVIDERS=${{ secrets.NONPROD_USE_RESULT_PROVIDERS }}
          ENABLED_FEATURES=${{ secrets.NONPROD_ENABLED_FEATURES }}
          DISABLED_FEATURES=${{ secrets.NONPROD_DISABLED_FEATURES }}
          VERSION_CHECK_API_URL=${{ secrets.NONPROD_VERSION_CHECK_API_URL }}
          VERSION_CHECK_INTERVAL_SECONDS=${{ secrets.NONPROD_VERSION_CHECK_INTERVAL_SECONDS }}
          DAPP_HOMEPAGE=https://usernode-dapp-homepage-87a553.social-vibecoding.usernodelabs.org/
          EXPLORER_PRIMARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_SECONDARY_URL=https://testnet-explorer.usernodelabs.org/api
          EXPLORER_TIMEOUT_SECONDS=10
          EXPLORER_CACHE_TTL_MINUTES=5
          EOF
          fi
          echo "✅ Created .env file with ${{ steps.env_config.outputs.env_type }} secrets"

      - name: Provision Social push iOS client
        env:
          SOCIAL_PUSH_ENV_TYPE: ${{ steps.env_config.outputs.env_type }}
          PROD_SOCIAL_PUSH_REQUIRED: ${{ vars.PROD_SOCIAL_PUSH_REQUIRED || 'false' }}
          NONPROD_SOCIAL_PUSH_REQUIRED: ${{ vars.NONPROD_SOCIAL_PUSH_REQUIRED || 'false' }}
          PROD_PUSH_ENV: ${{ vars.PROD_PUSH_ENV }}
          NONPROD_PUSH_ENV: ${{ vars.NONPROD_PUSH_ENV }}
          PROD_FIREBASE_PROJECT_ID: ${{ vars.PROD_FIREBASE_PROJECT_ID }}
          NONPROD_FIREBASE_PROJECT_ID: ${{ vars.NONPROD_FIREBASE_PROJECT_ID }}
          PROD_MOBILE_API_BASE_URL: ${{ vars.PROD_MOBILE_API_BASE_URL }}
          NONPROD_MOBILE_API_BASE_URL: ${{ vars.NONPROD_MOBILE_API_BASE_URL }}
          PROD_FIREBASE_CLIENT_CONFIG_BASE64: ${{ secrets.PROD_FIREBASE_IOS_CONFIG_BASE64 }}
          NONPROD_FIREBASE_CLIENT_CONFIG_BASE64: ${{ secrets.NONPROD_FIREBASE_IOS_CONFIG_BASE64 }}
        run: bash tool/provision-social-push-build.sh ios

      - name: Build iOS app (no codesign)
        run: |
          set -euo pipefail
          flutter build ios \
            --release \
            --no-codesign \
            --build-number=${{ steps.version.outputs.build_number }} \
            --build-name=${{ steps.version.outputs.version_number }} \
            --dart-define-from-file=.env

      - name: Build and upload via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          DELIVER_ALTOOL_ADDITIONAL_UPLOAD_PARAMETERS: "--use-old-altool"
        run: |
          # Always run the fastlane ios lane in PROD mode, matching the
          # de-facto behavior of build-and-deploy.yml (its BUILD_ENV line is
          # Ruby syntax in a shell step, so fastlane has always defaulted to
          # PROD). The NONPROD path is broken on two counts: the "Usernode
          # Internal" profiles are no longer installed on CI, and the
          # "-internal" version suffix is rejected by App Store Connect
          # (CFBundleShortVersionString must be numeric). The app's .env
          # (dart-defines) is still selected by env_type above.
          export BUILD_ENV=PROD
          bundle exec fastlane ios release

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-manual-${{ github.event.inputs.version }}
          path: build/ios/*.ipa
          retention-days: 90

  tag:
    name: Create Tag
    runs-on: ubuntu-latest
    needs: [prepare-frb-bindings, build-android, build-ios]
    if: >
      needs.build-android.result == 'success' &&
      needs.build-ios.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-frb-bindings.outputs.mobile_app_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create custom tag
        run: |
          set -euo pipefail
          TAG_NAME="${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" -m "Manual build: $TAG_NAME (build ${{ needs.build-android.outputs.build_number }})"
          git push origin "$TAG_NAME"
          echo "✅ Created tag: $TAG_NAME"

  notify:
    name: Send Notification
    runs-on: ubuntu-20.04-16core2
    needs: [build-android, build-ios, tag]
    if: always()
    steps:
      - name: Determine status and action
        id: status
        run: |
          ACTION="manual build ${{ github.event.inputs.version }}"
          BUILD="${{ needs.build-android.outputs.build_number }}"
          VERSION="${{ github.event.inputs.version }}"
          ANDROID_RESULT="${{ needs.build-android.result }}"
          IOS_RESULT="${{ needs.build-ios.result }}"

          if [ "$ANDROID_RESULT" == "failure" ] || [ "$IOS_RESULT" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          fi

          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "android_result=$ANDROID_RESULT" >> $GITHUB_OUTPUT
          echo "ios_result=$IOS_RESULT" >> $GITHUB_OUTPUT

      - name: Send Discord notification
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.status.outputs.status }}" == "success" ]; then
            COLOR=5763719  # Green
          else
            COLOR=15548997  # Red
          fi

          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d "{
              \"content\": \"${{ steps.status.outputs.emoji }} Build ${{ steps.status.outputs.build }} ${{ steps.status.outputs.action }} - ${{ steps.status.outputs.status }}\",
              \"embeds\": [{
                \"title\": \"Manual Build\",
                \"color\": $COLOR,
                \"fields\": [
                  {
                    \"name\": \"Version\",
                    \"value\": \"${{ steps.status.outputs.version }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Build Number\",
                    \"value\": \"${{ steps.status.outputs.build }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Status\",
                    \"value\": \"${{ steps.status.outputs.status }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Ref\",
                    \"value\": \"${{ github.event.inputs.ref }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Triggered by\",
                    \"value\": \"${{ github.actor }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Android\",
                    \"value\": \"${{ steps.status.outputs.android_result }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"iOS\",
                    \"value\": \"${{ steps.status.outputs.ios_result }}\",
                    \"inline\": true
                  },
                  {
                    \"name\": \"Run\",
                    \"value\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                    \"inline\": false
                  }
                ],
                \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%S.000Z)\"
              }]
            }"
