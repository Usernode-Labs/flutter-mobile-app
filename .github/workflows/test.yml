name: Test Suite

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run tests every day at 6 AM UTC
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  resolve-usernode-ref:
    name: Resolve Usernode Ref
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.usernode-ref.outputs.ref }}
    steps:
      - name: Resolve usernode ref
        id: usernode-ref
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          REF=$(printf '%s\n' "$PR_BODY" | sed -n 's/^Usernode-Ref:[[:space:]]*//p' | tail -n 1)
          REF=${REF:-main}
          git check-ref-format --branch "$REF" >/dev/null
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Usernode ref: $REF"

  prepare-frb-bindings:
    name: Prepare FRB Bindings
    needs: resolve-usernode-ref
    uses: ./.github/workflows/prepare-frb-bindings.yml
    with:
      usernode_ref: ${{ needs.resolve-usernode-ref.outputs.ref }}
    secrets: inherit

  unit-tests:
    name: Code Analysis and Tests
    runs-on: ubuntu-20.04-16core2
    needs: prepare-frb-bindings
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated bindings
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prepare-frb-bindings.outputs.artifact_name }}
          path: ${{ runner.temp }}/frb-bindings-artifact

      - name: Restore generated Dart bindings
        run: |
          rm -rf lib/src/rust
          mkdir -p lib/src/rust
          cp -R "$RUNNER_TEMP/frb-bindings-artifact/dart/." lib/src/rust/

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.prepare-frb-bindings.outputs.flutter_version }}
          channel: "stable"
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test --coverage --reporter expanded 
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-unit

      - name: Run widget tests
        run: flutter test --coverage test/widget_test.dart --reporter expanded

      - name: Generate coverage
        run: flutter test --coverage 
      - name: Check coverage threshold
        run: |
          # Install lcov
          sudo apt-get install -y lcov

          # Calculate coverage percentage
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "Coverage: $COVERAGE%"

          # Fail if coverage is below 70%
          if (( $(echo "$COVERAGE < 70" | bc -l) )); then
            echo "❌ Coverage is below 70%"
          else
            echo "✅ Coverage is above 70%"
          fi

      - name: Check results
        run: |
          echo "⏭️  All tests temporarily disabled"
          echo "✅ No tests to run"

      - name: Run iOS integration tests
        run: |
          echo "Will come later..."

      - name: Run Android integration tests
        run: |
          echo "Will come later..."
