plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def sentryAuthToken = System.getenv('SENTRY_AUTH_TOKEN')
def sentryOrg = System.getenv('SENTRY_ORG')
def sentryProject = System.getenv('SENTRY_PROJECT')
def sentryCiConfigured = [sentryAuthToken, sentryOrg, sentryProject]
    .every { value -> value != null && !value.trim().isEmpty() }

// A release bundle signed with the debug key is not uploadable: Play rejects it,
// and the error it returns names neither the key nor this file. That fallback
// exists so `flutter run --release` works on a fresh clone, so rather than
// removing it, refuse to let it reach an artifact anyone would try to ship.
//
// Set ALLOW_DEBUG_SIGNED_RELEASE=true to build an unsigned-for-release bundle
// deliberately, e.g. a local size check that will never leave the machine.
def appProjectPath = project.path
gradle.taskGraph.whenReady { graph ->
    // Re-derived rather than captured: this closure resolves names against the
    // project delegate, where the script's local defs are not visible.
    if (rootProject.file('key.properties').exists()) return
    if (System.getenv('ALLOW_DEBUG_SIGNED_RELEASE') == 'true') return

    def taskNames = graph.allTasks.findAll { it.project.path == appProjectPath }*.name
    if (!taskNames.contains('bundleRelease')) {
        if (taskNames.contains('assembleRelease')) {
            logger.warn('')
            logger.warn('WARNING  android/key.properties is missing, so this release APK is')
            logger.warn('         signed with the debug key. Fine to run, impossible to upload.')
            logger.warn('')
        }
        return
    }

    throw new GradleException("""
Refusing to build a release bundle signed with the debug key.

android/key.properties is missing, so signingConfigs.release fell back to
~/.android/debug.keystore. Play rejects a bundle signed that way, and its
error message points at neither the key nor this file.

Create android/key.properties with:

    storeFile=/absolute/path/to/homeroom-upload.jks
    storePassword=...
    keyAlias=homeroom
    keyPassword=...

On CI these come from the ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD,
KEY_ALIAS and KEY_PASSWORD secrets.

To build one anyway, for something that will never be uploaded:
    ALLOW_DEBUG_SIGNED_RELEASE=true <your command>
""")
}

if (sentryCiConfigured) {
    apply plugin: 'io.sentry.android.gradle'
} else {
    logger.lifecycle('Sentry CI upload environment is incomplete; skipping Sentry Android build tooling.')
}

// Firebase identity is provisioned by the build environment. Keep local
// checkouts without a client file buildable; Dart then exposes push as
// unavailable instead of silently targeting an unintended project.
def googleServicesJsonCandidates = [
    file('google-services.json'),
    file('src/debug/google-services.json'),
    file('src/profile/google-services.json'),
    file('src/release/google-services.json'),
]
if (googleServicesJsonCandidates.any { candidate -> candidate.exists() }) {
    apply plugin: 'com.google.gms.google-services'
    googleServices {
        missingGoogleServicesStrategy =
            com.google.gms.googleservices.GoogleServicesPlugin.MissingGoogleServicesStrategy.WARN
    }
} else {
    logger.lifecycle('Firebase Android configuration is absent; Social push is unavailable.')
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ADD THIS SECTION - Load keystore properties
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

    android {
        namespace "com.onhomeroom.app"
        compileSdk flutter.compileSdkVersion
        def ndkVersionOverride =
                System.getenv("NDK_VERSION") ?: System.getenv("ANDROID_NDK_VERSION")
        ndkVersion ndkVersionOverride ?: flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
            jniLibs.srcDirs = ['src/jniLibs']
        }
    }

    defaultConfig {
        applicationId "com.onhomeroom.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Add this to exclude i686-linux-android (x86 32-bit)
        ndk {
            abiFilters 'arm64-v8a'
        }

        // Environment-based configuration using dart-define variables
        // App name will be controlled via environment variables
        resValue "string", "app_name", "Homeroom"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            } else {
                // Kept so `flutter run --release` works on a fresh clone. An
                // artifact signed this way can never be uploaded, so the task
                // graph check below refuses to let one reach a bundle.
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            // Real key when android/key.properties exists, debug key otherwise
            // (see signingConfigs.release, and the guard below it).
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                // Embed native debug symbols in AABs and generate the sidecar archive for APKs.
                debugSymbolLevel 'FULL'
            }
        }
    }


}

if (sentryCiConfigured) {
    sentry {
        org = sentryOrg
        projectName = sentryProject
        authToken = sentryAuthToken

        includeProguardMapping = true
        autoUploadProguardMapping = true
        uploadNativeSymbols = true
        autoUploadNativeSymbols = true
        includeNativeSources = false
        includeSourceContext = false

        // Symbol publication must not add SDKs or change runtime behavior.
        tracingInstrumentation {
            enabled = false
        }
        runtimeOptimizations {
            enabled = false
        }
        autoInstallation {
            enabled = false
        }
        includeDependenciesReport = false
        telemetry = false
    }
}

flutter {
    source '../..'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:-options'
}

dependencies {
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // ShortcutManagerCompat / IconCompat for homescreen pinned shortcuts.
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
}
