name: crypto_mobile_app
description: A comprehensive crypto mobile application

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # 🔥 NEW: For internationalization
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  rust_lib_crypto_mobile_app:
    path: rust_builder
  flutter_rust_bridge: 2.11.1

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
