name: crypto_mobile_app
description: A New Layer 1 Operated & Secured by users from their phones.

version: 0.1.0+8
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  go_router: ^14.2.0
  cupertino_icons: ^1.0.2
  qr_flutter: ^4.1.0
  rust_lib_crypto_mobile_app:
    path: rust_builder
  flutter_rust_bridge:
    git:
      url: https://github.com/Usernode-Labs/flutter_rust_bridge
      ref: 1a911e6435156487cb73929f652dd983ce3fabf6
      path: frb_dart
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  sentry_flutter: ^9.7.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  skeletonizer: ^2.1.0

  freezed_annotation: ^2.4.4
  logger: ^2.0.0
  collection: any
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  freezed: ^2.5.2
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/feature_flags.json
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon-1024.png